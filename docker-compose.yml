services:
  postgres:
    image: postgres:17-alpine
    container_name: linky-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-linky}
      POSTGRES_USER: ${DB_USER:-linky}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set}
    ports:
      - "5432:5432"
    volumes:
      - linky-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-linky} -d ${DB_NAME:-linky}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  linky-pgdata: