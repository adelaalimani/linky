services:
  postgres:
    image: postgres:17-alpine
    container_name: linky-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-linky}
      POSTGRES_USER: ${DB_USER:-linky}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set}
    ports:
      - "5432:5432"
    volumes:
      - linky-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-linky} -d ${DB_NAME:-linky}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: linky-redis
    command:
      - redis-server
      - --user
      - default
      - "off"
      - --user
      - ${REDIS_USERNAME:?REDIS_USERNAME is not set}
      - "on"
      - ">${REDIS_PASSWORD:?REDIS_PASSWORD is not set}"
      - "~*"
      - "&*"
      - "+@all"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - volatile-lfu
      - --appendonly
      - "yes"
    environment:
      REDIS_USERNAME: ${REDIS_USERNAME}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - linky-redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning --user \"$$REDIS_USERNAME\" --pass \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  linky:
    image: adelaalimani97/linky:${LINKY_IMAGE_TAG:-latest}
    container_name: linky-app

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-linky}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-linky}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set}

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_USERNAME: ${REDIS_USERNAME:?REDIS_USERNAME is not set}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is not set}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    restart: unless-stopped

volumes:
  linky-pgdata:
  linky-redisdata: