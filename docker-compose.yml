services:
  postgres:
    image: postgres:17-alpine
    container_name: linky-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-linky}
      POSTGRES_USER: ${DB_USER:-linky}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set}
    ports:
      - "5432:5432"
    volumes:
      - linky-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-linky} -d ${DB_NAME:-linky}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: linky-redis
    # Disable the passwordless "default" user and create our own ACL user with full access
    command:
      - redis-server
      - --user
      - default
      - "off"
      - --user
      - ${REDIS_USERNAME:?REDIS_USERNAME is not set}
      - "on"
      - ">${REDIS_PASSWORD:?REDIS_PASSWORD is not set}"
      - "~*"
      - "&*"
      - "+@all"
    environment:
      REDIS_USERNAME: ${REDIS_USERNAME}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning --user \"$$REDIS_USERNAME\" --pass \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  linky-pgdata: