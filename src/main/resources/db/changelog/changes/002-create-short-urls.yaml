databaseChangeLog:
  - changeSet:
      id: 002-create-short-urls
      author: linky
      changes:
        - createTable:
            schemaName: linky
            tableName: short_urls
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: short_key
                  type: VARCHAR(7)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_short_urls_short_key
              - column:
                  name: long_url
                  type: VARCHAR(2048)
                  constraints:
                    nullable: false
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: used_count
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: now()
                  constraints:
                    nullable: false