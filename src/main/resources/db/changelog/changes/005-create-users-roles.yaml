databaseChangeLog:
  - changeSet:
      id: 005-create-users-roles
      author: linky
      changes:
        - createTable:
            schemaName: linky
            tableName: users_roles
            columns:
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_users_roles_user
                    references: linky.users(id)
                    deleteCascade: true
              - column:
                  name: role_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_users_roles_role
                    references: linky.roles(id)
        - addPrimaryKey:
            schemaName: linky
            tableName: users_roles
            columnNames: user_id, role_id
            constraintName: pk_users_roles
