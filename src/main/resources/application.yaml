spring:
  application:
    name: linky
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:linky}
    username: ${DB_USER:linky}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: linky
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    liquibase-schema: public

  threads:
    virtual:
      enabled: true

server:
  forward-headers-strategy: framework
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

linky:
  base-url: ${LINKY_BASE_URL:http://localhost:8080}
