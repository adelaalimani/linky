spring:
  application:
    name: linky
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:linky}
    username: ${DB_USER:linky}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: linky
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    liquibase-schema: public
  data:
    web:
      pageable:
        serialization-mode: via-dto
        max-page-size: 100
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}

  threads:
    virtual:
      enabled: true

server:
  forward-headers-strategy: framework
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

linky:
  base-url: ${LINKY_BASE_URL:http://localhost:8080}

app:
  security:
    jwt:
      access-token-expiration: 86400000 # 1 day
      refresh-token-expiration: 604800000
  rate-limit:
    default: # per user, or per IP when not logged in
      capacity: 60 # requests allowed per refill period
      refill-period: 1m
    auth: # /api/v1/auth/**, per IP
      capacity: 5
      refill-period: 1m
